name = "easyread-sync"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "easyread-sync"
database_id = "" # 运行 `wrangler d1 create easyread-sync` 后填入

# R2 存储桶（用于页面快照）
[[r2_buckets]]
binding = "R2"
bucket_name = "easyread-snapshots"

# 环境变量
[vars]
JWT_SECRET = "" # 生产环境需要设置强随机密钥
CORS_ORIGIN = "*" # 生产环境改为具体域名

# 开发环境
[env.dev]
vars = { JWT_SECRET = "dev-secret-key-change-in-production" }
