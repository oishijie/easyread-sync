name = "easyread-sync"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# 把 src/web/*.html 作为文本模块打包进 Worker
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "easyread-sync"
database_id = "" # 运行 `wrangler d1 create easyread-sync` 后填入

# R2 存储桶（页面快照用）
# 需要在 Cloudflare 后台单独开通。未开通时注释掉整段，快照接口会返回 501。
[[r2_buckets]]
binding = "R2"
bucket_name = "easyread-snapshots"

# 非敏感环境变量；JWT_SECRET 用 `wrangler secret put JWT_SECRET` 设置
[vars]
CORS_ORIGIN = "*" # 生产环境改为具体域名

[env.dev]
vars = { CORS_ORIGIN = "*" }
